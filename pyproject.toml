[tool.poetry]
name = "jubapi"
version = "0.1.0a0"
description = ""
authors = ["Ignacio Castillo <ignacio.bcastillo@gmail.com>"]
license = "GPL-3.0-only"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4"
uvicorn = "^0.30.4"
pymongo = "^4.8.0"
option = "^2.1.0"
nanoid = "^2.0.0"
pydantic = "^2.8.2"
motor = "^3.6.0"
pyparsing = "^3.2.0"
python-multipart = "^0.0.22"
httpx = "^0.28.1"
commonx = {version = "0.0.1a3", source = "test"}
xolo = {version = "0.0.11a2", allow-prereleases = true, source = "test"}
pyyaml = "^6.0.3"
nez-sdk = "^1.0.0"
cachetools = ">=5.3.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
requests = "^2.32.3"
pytest-asyncio = "^0.24.0"
pytest-order = "^1.3.0"
coverage = "^7.13.4"
pytest-env = "<1.6.0"

[tool.poetry.group.docs.dependencies]
mkdocstrings-python = "^2.0.3"
zensical = "^0.0.24"



[[tool.poetry.source]]
name = "test"
url = "https://test.pypi.org/simple/"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"



[tool.pytest.ini_options]
asyncio_mode = "auto"
