<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JUB — Radar Chart Template</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
    header { padding: 1.5rem 2rem; background: #1e293b; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.25rem; font-weight: 600; color: #a78bfa; }
    header p  { font-size: 0.85rem; color: #94a3b8; margin-top: 0.25rem; }
    #chart    { width: 100%; height: calc(100vh - 80px); }
  </style>
</head>
<body>
  <header>
    <h1>Perfil Multi-Dimensional — Radar</h1>
    <p>Comparación de indicadores por categoría · JUB Product Viewer</p>
  </header>
  <div id="chart"></div>

  <script>
    const chart = echarts.init(document.getElementById('chart'));

    // Placeholder dimensions — replace with real catalog variables.
    const dimensions = [
      { name: 'Mortalidad',    max: 100 },
      { name: 'Incidencia',    max: 100 },
      { name: 'Prevalencia',   max: 100 },
      { name: 'Cobertura',     max: 100 },
      { name: 'Derechohabiencia', max: 100 },
      { name: 'Edad promedio', max: 100 },
    ];

    // Two synthetic series (e.g., Hombres vs Mujeres)
    const seriesA = [72, 55, 63, 40, 68, 52];
    const seriesB = [45, 70, 58, 65, 72, 48];

    chart.setOption({
      backgroundColor: '#0f172a',
      legend: {
        data: ['Hombres', 'Mujeres'],
        textStyle: { color: '#94a3b8' },
        top: 10,
      },
      tooltip: { trigger: 'item' },
      radar: {
        indicator: dimensions,
        shape: 'circle',
        splitNumber: 4,
        name: { textStyle: { color: '#cbd5e1', fontSize: 12 } },
        splitLine:  { lineStyle: { color: '#1e293b' } },
        splitArea:  { areaStyle: { color: ['#1e293b', '#0f172a'] } },
        axisLine:   { lineStyle: { color: '#334155' } },
      },
      series: [{
        type: 'radar',
        data: [
          {
            name: 'Hombres',
            value: seriesA,
            symbol: 'circle', symbolSize: 5,
            lineStyle: { color: '#38bdf8', width: 2 },
            areaStyle: { color: 'rgba(56,189,248,0.15)' },
            itemStyle: { color: '#38bdf8' },
          },
          {
            name: 'Mujeres',
            value: seriesB,
            symbol: 'circle', symbolSize: 5,
            lineStyle: { color: '#a78bfa', width: 2 },
            areaStyle: { color: 'rgba(167,139,250,0.15)' },
            itemStyle: { color: '#a78bfa' },
          },
        ],
      }],
    });

    window.addEventListener('resize', () => chart.resize());
  </script>
</body>
</html>
